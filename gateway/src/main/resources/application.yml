server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  autoconfigure:
    # shared-auth is only used for its JWT classes; don't start its gRPC server pieces.
    exclude: com.stdiscm.sharedauth.SharedAuthAutoConfiguration

gateway:
  # Every gRPC call gets this deadline. A down node fails fast instead of hanging the page.
  deadline-ms: ${GRPC_DEADLINE_MS:2000}
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:deploy/keys/public.pem}
  cookie:
    name: token
    # Set to true when served over HTTPS.
    secure: ${COOKIE_SECURE:false}
  cors:
    # Only needed when the React dev server runs on another origin without the Vite proxy.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  services:
    auth: ${AUTH_ADDR:localhost:9001}
    course: ${COURSE_ADDR:localhost:9002}
    grade: ${GRADE_ADDR:localhost:9003}
    announcement: ${ANNOUNCEMENT_ADDR:localhost:9004}
