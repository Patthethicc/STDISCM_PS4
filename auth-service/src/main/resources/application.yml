spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:auth_db}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:auth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema comes from db/auth/schema.sql

# Bonus 3: shared explicit pool (shared-db module).
db:
  pool:
    name: auth-pool
    maximum-pool-size: ${DB_POOL_MAX:10}
    minimum-idle: ${DB_POOL_MIN_IDLE:2}
    idle-timeout-ms: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
    connection-timeout-ms: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
    max-lifetime-ms: ${DB_POOL_MAX_LIFETIME_MS:1800000}
    log-interval-ms: ${DB_POOL_LOG_INTERVAL_MS:10000}
    log-checkouts: ${DB_POOL_LOG_CHECKOUTS:false}

  # Bonus 1: a read-only streaming replica takes over while the primary DB is down.
  # Empty host = no replica, failover off, and the pool above is used as is.
  failover:
    replica-host: ${AUTH_DB_REPLICA_HOST:}
    replica-port: ${AUTH_DB_REPLICA_PORT:5432}

grpc:
  server:
    port: ${GRPC_PORT:9001}

auth:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:deploy/keys/public.pem}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:deploy/keys/private.pem}
    ttl-minutes: ${JWT_TTL_MINUTES:15}
