spring:
  application:
    name: auth-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema comes from db/auth/schema.sql

grpc:
  server:
    port: ${GRPC_PORT:9001}

auth:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:deploy/keys/public.pem}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:deploy/keys/private.pem}
    ttl-minutes: ${JWT_TTL_MINUTES:15}

# Database + Bonus 1 replica failover (shared-db). Built by config/DataSourceConfig.
db:
  name: ${AUTH_DB_NAME:auth_db}
  user: ${AUTH_DB_USER:auth}
  password: ${AUTH_DB_PASSWORD:auth}
  primary:
    host: ${AUTH_DB_HOST:localhost}
    port: ${AUTH_DB_PORT:5432}
  replica:
    host: ${AUTH_DB_REPLICA_HOST:}       # empty = no replica (failover off)
    port: ${AUTH_DB_REPLICA_PORT:5432}
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout-ms: 60000
    connection-timeout-ms: 500
    validation-timeout-ms: 300
    max-lifetime-ms: 600000
  failover:
    recheck-ms: 5000
