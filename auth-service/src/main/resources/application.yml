spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:auth_db}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:auth}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema comes from db/auth/schema.sql

grpc:
  server:
    port: ${GRPC_PORT:9001}

auth:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:deploy/keys/public.pem}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:deploy/keys/private.pem}
    ttl-minutes: ${JWT_TTL_MINUTES:15}
