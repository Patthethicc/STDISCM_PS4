spring:
  application:
    name: feature-service
  datasource:
    url: jdbc:postgresql://${FEATURE_DB_HOST:localhost}:${FEATURE_DB_PORT:5432}/${FEATURE_DB_NAME:feature_db}
    username: ${FEATURE_DB_USER:feature}
    password: ${FEATURE_DB_PASSWORD:feature}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema comes from db/feature/schema.sql

# Bonus 3: shared explicit pool (shared-db module).
db:
  pool:
    name: feature-pool
    maximum-pool-size: ${DB_POOL_MAX:10}
    minimum-idle: ${DB_POOL_MIN_IDLE:2}
    idle-timeout-ms: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
    connection-timeout-ms: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
    max-lifetime-ms: ${DB_POOL_MAX_LIFETIME_MS:1800000}
    log-interval-ms: ${DB_POOL_LOG_INTERVAL_MS:10000}
    log-checkouts: ${DB_POOL_LOG_CHECKOUTS:false}

grpc:
  server:
    port: ${GRPC_PORT:9004}

auth:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:deploy/keys/public.pem}
