spring:
  application:
    name: feature-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema comes from db/feature/schema.sql

grpc:
  server:
    port: ${GRPC_PORT:9004}

auth:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:deploy/keys/public.pem}

# Database + Bonus 1 replica failover (shared-db). Built by config/DataSourceConfig.
db:
  name: ${FEATURE_DB_NAME:feature_db}
  user: ${FEATURE_DB_USER:feature}
  password: ${FEATURE_DB_PASSWORD:feature}
  primary:
    host: ${FEATURE_DB_HOST:localhost}
    port: ${FEATURE_DB_PORT:5432}
  replica:
    host: ${FEATURE_DB_REPLICA_HOST:}       # empty = no replica (failover off)
    port: ${FEATURE_DB_REPLICA_PORT:5432}
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout-ms: 60000
    connection-timeout-ms: 500
    validation-timeout-ms: 300
    max-lifetime-ms: 600000
  failover:
    recheck-ms: 5000
